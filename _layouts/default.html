<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<style>
  @font-face {
    font-family: 'Ubuntu Mono';
    src: url('/ubuntu-mono.ttf') format('truetype-variations');
    font-weight: 400 700;
    font-display: swap;
  }

  :root {
    --bg: #0a0a0a;
    --text: #f0f0f0;
    --text-dim: #a3a3a3;
    --text-dimmer: #6a6a6a;
    --border: rgba(255,255,255,0.10);
    --glass: rgba(255,255,255,0.045);
    --glass-strong: rgba(255,255,255,0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #161616 0%, #0a0a0a 55%);
    color: var(--text);
    font-family: 'Ubuntu Mono', 'Cascadia Mono', 'SF Mono', Consolas, Menlo, monospace;
    line-height: 1.7;
  }

  .glass {
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 16px;
  }

  header {
    max-width: 700px;
    margin: 0 auto;
    padding: 32px 20px 0 20px;
  }

  nav {
    display: flex;
    gap: 4px;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px 14px;
    margin-bottom: 32px;
  }
  nav a {
    color: var(--text-dim);
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 8px;
  }
  nav a:hover { color: var(--text); background: var(--glass-strong); }
  nav a.active { color: var(--text); background: var(--glass-strong); }

  main {
    max-width: 700px;
    margin: 0 auto;
    padding: 0 20px 80px 20px;
  }

  main > .glass { padding: 36px 40px; }

  h1, h2, h3 {
    color: #ffffff;
    line-height: 1.35;
    font-weight: 700;
  }
  h1 { font-size: 24px; margin-bottom: 4px; }
  h2 { font-size: 17px; margin-top: 40px; letter-spacing: 0.02em; }

  p { font-size: 15px; color: var(--text); margin: 18px 0; }

  a { color: var(--text); text-decoration-color: var(--text-dimmer); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--text); }

  .meta {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dimmer);
    margin-bottom: 24px;
  }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 40px 0;
  }

  ol, ul { font-size: 15px; padding-left: 22px; }
  li { margin: 8px 0; }

  code {
    background: var(--glass-strong);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.92em;
  }

  blockquote {
    border-left: 2px solid var(--text-dimmer);
    margin: 20px 0;
    padding-left: 16px;
    color: var(--text-dim);
  }

  .post-list-item {
    padding: 16px;
    margin: 10px 0;
    border-radius: 10px;
    background: var(--glass);
    border: 1px solid var(--border);
  }
  .post-list-item .date { font-size: 11px; color: var(--text-dimmer); letter-spacing: 0.04em; }
  .post-list-item a {
    display: block;
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
    text-decoration: none;
    margin-top: 4px;
  }
  .post-list-item a:hover { color: var(--text-dim); }

  .empty-note { color: var(--text-dimmer); font-size: 14px; }

  footer {
    max-width: 700px;
    margin: 0 auto;
    padding: 0 20px 60px 20px;
    font-size: 11px;
    color: var(--text-dimmer);
  }
  footer a { color: var(--text-dimmer); }
</style>
</head>
<body>

<header>
  <nav class="glass">
    <a href="/" {% if page.url == "/" %}class="active"{% endif %}>Home</a>
    <a href="/about/" {% if page.url == "/about/" %}class="active"{% endif %}>About</a>
    <a href="/roadmap/" {% if page.url == "/roadmap/" %}class="active"{% endif %}>Roadmap</a>
    <a href="/blog/" {% if page.url == "/blog/" or page.layout == "post" %}class="active"{% endif %}>Blog</a>
  </nav>
</header>

<main>
<div class="glass">
{{ content }}
</div>
</main>

<footer>
  <a href="https://github.com/Basit-Balogun10">GitHub</a>
</footer>

</body>
</html>
