<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.url == "/" %}{{ site.title }}{% elsif page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%230a0a0a%22/><text x=%2250%22 y=%2268%22 font-family=%22monospace%22 font-size=%2248%22 font-weight=%22700%22 fill=%22%23f0f0f0%22 text-anchor=%22middle%22>BB</text></svg>">
<meta name="description" content="{{ page.description | default: site.description }}">
<style>
  @font-face {
    font-family: 'Ubuntu Mono';
    src: url('/ubuntu-mono.ttf') format('truetype-variations');
    font-weight: 400 700;
    font-display: swap;
  }

  :root {
    --bg: #0a0a0a;
    --text: #f0f0f0;
    --text-dim: #a3a3a3;
    --text-dimmer: #6a6a6a;
    --border: rgba(255,255,255,0.10);
    --glass: rgba(255,255,255,0.045);
    --glass-strong: rgba(255,255,255,0.08);
  }

  * { box-sizing: border-box; }

  /* Smooth cross-fade between pages on real (non-SPA) navigation.
     No JS, no framework -- just a CSS opt-in. Chromium supports it
     today; unsupported browsers just get normal instant navigation,
     same as before this rule existed. */
  @view-transition {
    navigation: auto;
  }

  /* Gradients are layered directly on body's own background (not a
     separate ::before with z-index) -- that avoids any stacking-context
     ambiguity, since body itself isn't positioned and z-index on an
     unpositioned ancestor's pseudo-element is exactly the kind of thing
     that silently does nothing in some browsers. Fixed pixel sizes, not
     viewport-relative percentages, so the glow reliably reaches the
     centered content column regardless of screen width. background-
     attachment:fixed keeps it from scrolling with the page. */
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 1000px 600px at 50% -10%, rgba(255,255,255,0.42), transparent 70%),
      radial-gradient(ellipse 700px 550px at 15% 60%, rgba(255,255,255,0.28), transparent 70%),
      radial-gradient(ellipse 700px 550px at 85% 90%, rgba(255,255,255,0.28), transparent 70%),
      #0a0a0a;
    /* Larger than the viewport so background-position has room to
       actually pan -- without this, the gradients already cover
       100% of the element and shifting position has nothing visible
       to do. */
    background-size: 145% 145%;
    background-attachment: fixed;
    animation: drift 24s ease-in-out infinite alternate;
    color: var(--text);
    font-family: 'Ubuntu Mono', 'Cascadia Mono', 'SF Mono', Consolas, Menlo, monospace;
    line-height: 1.7;
  }

  /* Real Ken Burns (zoom + pan on a still image), same mechanism as
     Lively Wallpaper's generator: an oversized layer (124% width/height,
     inset -12% top/left so zoom/pan never reveals empty edges) animated
     via transform, not background-position -- transform is what lets
     this actually scale smoothly instead of just panning. Swapped in by
     JS once a randomly-picked photo has finished loading; the plain
     drifting gradient above is the real fallback (no-JS, image load
     failure, Data Saver, or the visitor turning it off), not a
     placeholder. */
  /* z-index:-1 on a position:fixed element is a known unreliable
     pattern -- it can end up rendering behind the page's own base
     background/canvas in some browsers instead of just behind the
     content, making it invisible outright. Using a plain non-negative
     z-index here, with header/main explicitly positioned above it,
     avoids that ambiguity entirely -- this is the second time this
     exact class of bug has bitten this file, not guessing this time. */
  .bg-photo-layer {
    display: none;
    position: fixed;
    top: -12%;
    left: -12%;
    width: 124%;
    height: 124%;
    z-index: 0;
    background-image:
      linear-gradient(rgba(10,10,10,0.55), rgba(10,10,10,0.75)),
      var(--bg-photo);
    background-size: cover;
    background-position: center;
    animation: kenburns 42s ease-in-out infinite alternate;
  }
  body.bg-photo .bg-photo-layer { display: block; }
  body.bg-photo { animation: none; }

  header, main { position: relative; z-index: 1; }

  @media (prefers-reduced-motion: reduce) {
    html, body { animation: none; }
    .bg-photo-layer { animation: none; }
  }
  html.reduce-motion, html.reduce-motion body { animation: none; }
  html.reduce-motion .bg-photo-layer { animation: none; }

  .glass {
    background: var(--glass);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1px solid var(--border);
    border-radius: 16px;
  }

  header {
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 20px 0 20px;
  }

  nav {
    display: flex;
    justify-content: center;
    gap: 16px;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px 14px;
    margin: 0 auto 32px auto;
    width: fit-content;
  }
  nav a {
    color: var(--text-dim);
    text-decoration: none;
    padding: 6px 18px;
    border-radius: 8px;
    transition: color 0.2s ease, background 0.2s ease;
  }
  nav a:hover { color: var(--text); background: var(--glass-strong); }
  nav a.active { color: var(--text); background: var(--glass-strong); }

  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 20px 80px 20px;
  }

  main > .glass {
    padding: 36px 40px;
    animation: rise 0.4s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes drift {
    from { background-position: 0% 0%; }
    to { background-position: 20% 14%; }
  }

  @keyframes kenburns {
    from { transform: scale(1) translate(0%, 0%); }
    to { transform: scale(1.15) translate(-2.5%, 2%); }
  }

  h1, h2, h3 {
    color: #ffffff;
    line-height: 1.35;
    font-weight: 700;
  }
  h1 { font-size: 24px; margin-bottom: 4px; }
  h2 { font-size: 17px; margin-top: 40px; letter-spacing: 0.02em; }

  p { font-size: 15px; color: var(--text); margin: 18px 0; }

  a { color: var(--text-dim); text-decoration-color: var(--text-dimmer); text-underline-offset: 3px; transition: color 0.2s ease, text-decoration-color 0.2s ease; }
  a:hover { color: var(--text); text-decoration-color: var(--text); }

  .meta {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dimmer);
    margin-bottom: 24px;
  }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 40px 0;
  }

  ol, ul { font-size: 15px; padding-left: 22px; }
  li { margin: 8px 0; }

  code {
    background: var(--glass-strong);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.92em;
  }

  blockquote {
    border-left: 2px solid var(--text-dimmer);
    margin: 20px 0;
    padding-left: 16px;
    color: var(--text-dim);
  }

  .social-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 20px 0;
  }
  .social-links a {
    padding: 6px 14px;
    border-radius: 20px;
    background: var(--glass);
    border: 1px solid var(--border);
    font-size: 13px;
    text-decoration: none;
    color: var(--text-dim);
    transition: color 0.2s ease, background 0.2s ease;
  }
  .social-links a:hover { background: var(--glass-strong); color: var(--text); }

  details.resume-toggle summary {
    display: inline-block;
    cursor: pointer;
    list-style: none;
    color: var(--text-dim);
    text-decoration: underline;
    text-decoration-color: var(--text-dimmer);
    text-underline-offset: 3px;
    font-size: 15px;
    user-select: none;
    transition: color 0.2s ease, text-decoration-color 0.2s ease;
  }
  details.resume-toggle summary::-webkit-details-marker { display: none; }
  details.resume-toggle summary:hover { color: var(--text); text-decoration-color: var(--text); }

  /* Chevron instead of the -> other nav links use -- this doesn't
     navigate anywhere, it expands content on the same page, so it
     shouldn't look like the same affordance. Rotates on open instead
     of just appearing/disappearing. */
  details.resume-toggle summary .chevron {
    display: inline-block;
    transition: transform 0.2s ease;
  }
  details.resume-toggle[open] summary .chevron { transform: rotate(90deg); }

  /* Transition-based, not a keyframe animation -- driven by the
     .visible class from the toggle listener below. A restarted
     keyframe animation flashes the content at full opacity for one
     frame before jumping back to its 0% state, which reads as a
     flicker; a transition just interpolates smoothly from wherever
     it currently is. */
  /* Starts hidden only once JS confirms it can actually reveal it
     again (.js-anim, added on load) -- without that, content would
     stay stuck at opacity:0 forever if JS fails to run. */
  .resume-content {
    margin-top: 16px;
  }
  .resume-content.js-anim {
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.4s ease-out, transform 0.4s ease-out;
  }
  .resume-content.js-anim.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .resume-content > h2:first-of-type { margin-top: 12px; }

  .post-list-item {
    padding: 16px;
    margin: 10px 0;
    border-radius: 10px;
    background: var(--glass);
    border: 1px solid var(--border);
  }
  .post-list-item .date { font-size: 11px; color: var(--text-dimmer); letter-spacing: 0.04em; }
  .post-list-item a {
    display: block;
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
    text-decoration: none;
    margin-top: 4px;
    transition: color 0.2s ease;
  }
  .post-list-item a:hover { color: var(--text-dim); }

  .empty-note { color: var(--text-dimmer); font-size: 14px; }

  /* One-word trigger, bottom-right, easy to ignore -- opens a small
     popover with the two things actually worth toggling: motion and
     the background photo. Not a settings page. */
  #display-settings {
    position: fixed;
    bottom: 12px;
    right: 12px;
    z-index: 30;
  }
  #display-toggle {
    font: inherit;
    font-size: 10px;
    color: var(--text-dimmer);
    background: none;
    border: none;
    text-decoration: underline;
    text-decoration-color: var(--text-dimmer);
    cursor: pointer;
    padding: 4px 2px;
    transition: color 0.2s ease, text-decoration-color 0.2s ease;
  }
  #display-toggle:hover { color: var(--text-dim); text-decoration-color: var(--text-dim); }

  #display-panel {
    display: none;
    position: absolute;
    bottom: 100%;
    right: 0;
    margin-bottom: 8px;
    padding: 12px 14px;
    min-width: 190px;
  }
  #display-panel.open { display: block; }
  #display-panel label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    padding: 4px 0;
    white-space: nowrap;
  }
  #display-panel input[type="checkbox"] {
    accent-color: var(--text-dim);
    cursor: pointer;
  }
  #display-panel label.disabled { color: var(--text-dimmer); cursor: default; }
  #display-panel label.disabled input { cursor: default; }

  @media (max-width: 480px) {
    header { padding: 16px 12px 0 12px; }
    main { padding: 0 12px 60px 12px; }
    main > .glass { padding: 20px 18px; }
    nav { gap: 4px; padding: 8px 10px; }
    nav a { padding: 6px 10px; font-size: 11px; }
    h1 { font-size: 21px; }
    h2 { font-size: 16px; margin-top: 30px; }
    p, ul, ol { font-size: 14px; }
    .social-links a { padding: 5px 11px; font-size: 12px; }
    #display-settings { bottom: 8px; right: 8px; }
    #display-toggle { font-size: 9px; }
  }
</style>
</head>
<body>

<div class="bg-photo-layer" aria-hidden="true"></div>

<header>
  <nav class="glass">
    <a href="/" {% if page.url == "/" %}class="active"{% endif %}>Home</a>
    <a href="/about/" {% if page.url == "/about/" %}class="active"{% endif %}>About</a>
    <a href="/roadmap/" {% if page.url == "/roadmap/" %}class="active"{% endif %}>Roadmap</a>
    <a href="/blog/" {% if page.url == "/blog/" or page.layout == "post" %}class="active"{% endif %}>Blog</a>
  </nav>
</header>

<main>
<div class="glass">
{{ content }}
</div>
</main>

<div id="display-settings">
  <button id="display-toggle" type="button">Display</button>
  <div id="display-panel" class="glass">
    <label id="motion-label"><input type="checkbox" id="reduce-motion-check"> Reduce motion</label>
    <label id="photo-label"><input type="checkbox" id="bg-photo-check"> Background photo <span id="photo-size"></span></label>
  </div>
</div>

<script>
// One random background photo per page load -- not fetched from any
// live API, just picked from the small pre-optimized set already in
// this repo (14 images, ~55KB average), and only swaps the CSS in
// once the image has actually finished loading, so there's no flash
// of a broken/half-loaded background. The plain gradient in the CSS
// is the real fallback -- not a placeholder -- for no-JS, image-load-
// failure, Data Saver, and manually-disabled cases alike.
//
// Two independent preferences, both in localStorage: motion and the
// photo itself. Motion's default follows the OS-level
// prefers-reduced-motion signal until the visitor explicitly picks
// one way or the other; the photo defaults to on unless Data Saver is
// active, in which case the checkbox is shown but disabled (visible
// so it's clear *why* there's no photo, not silently hidden).
(function () {
  var MOTION_KEY = 'reduce-motion';
  var PHOTO_KEY = 'bg-photo-disabled';
  var saveData = !!(navigator.connection && navigator.connection.saveData);

  // Actual on-disk size per image (KB, rounded), not an estimate --
  // index 0 = bg-01.webp, etc.
  var PHOTO_SIZES_KB = [33, 29, 55, 83, 50, 42, 9, 66, 154, 79, 60, 68, 32, 16];

  var toggleBtn = document.getElementById('display-toggle');
  var panel = document.getElementById('display-panel');
  var motionCheck = document.getElementById('reduce-motion-check');
  var photoCheck = document.getElementById('bg-photo-check');
  var photoLabel = document.getElementById('photo-label');
  var photoSizeEl = document.getElementById('photo-size');

  function motionReduced() {
    var stored = localStorage.getItem(MOTION_KEY);
    if (stored !== null) return stored === '1';
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }
  function photoDisabled() {
    return saveData || localStorage.getItem(PHOTO_KEY) === '1';
  }

  function applyMotion() {
    document.documentElement.classList.toggle('reduce-motion', motionReduced());
  }

  function loadPhoto() {
    var index = Math.floor(Math.random() * PHOTO_SIZES_KB.length);
    var pick = 'bg-' + String(index + 1).padStart(2, '0') + '.webp';
    var url = '/images/bg/' + pick;
    photoSizeEl.textContent = '(' + PHOTO_SIZES_KB[index] + 'KB)';
    var img = new Image();
    img.onload = function () {
      document.documentElement.style.setProperty('--bg-photo', 'url(' + url + ')');
      document.documentElement.classList.add('bg-photo');
      document.body.classList.add('bg-photo');
    };
    img.src = url;
  }

  applyMotion();
  motionCheck.checked = motionReduced();
  photoCheck.checked = !photoDisabled();
  photoCheck.disabled = saveData;
  if (saveData) photoLabel.classList.add('disabled');
  if (!photoDisabled()) loadPhoto();

  motionCheck.onchange = function () {
    localStorage.setItem(MOTION_KEY, motionCheck.checked ? '1' : '0');
    applyMotion();
  };

  photoCheck.onchange = function () {
    if (saveData) return;
    localStorage.setItem(PHOTO_KEY, photoCheck.checked ? '0' : '1');
    if (photoCheck.checked) {
      loadPhoto();
    } else {
      document.documentElement.classList.remove('bg-photo');
      document.body.classList.remove('bg-photo');
    }
  };

  toggleBtn.onclick = function (e) {
    e.stopPropagation();
    panel.classList.toggle('open');
  };
  document.addEventListener('click', function (e) {
    if (panel.classList.contains('open') && !panel.contains(e.target) && e.target !== toggleBtn) {
      panel.classList.remove('open');
    }
  });
})();

// .resume-content starts at opacity:0 always (see CSS). Adding
// .visible one frame after <details> opens lets the transition
// animate smoothly from that 0 state -- the double rAF ensures the
// browser has actually painted the opacity:0 frame first, so there's
// no flash to full opacity before the fade-in starts.
document.querySelectorAll('details.resume-toggle').forEach(function (d) {
  var content = d.querySelector('.resume-content');
  if (!content) return;
  content.classList.add('js-anim');
  d.addEventListener('toggle', function () {
    if (d.open) {
      content.classList.remove('visible');
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          content.classList.add('visible');
        });
      });
    } else {
      content.classList.remove('visible');
    }
  });
});
</script>

</body>
</html>
