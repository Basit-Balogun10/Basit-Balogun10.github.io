<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.url == "/" %}{{ site.title }}{% elsif page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%230a0a0a%22/><text x=%2250%22 y=%2268%22 font-family=%22monospace%22 font-size=%2248%22 font-weight=%22700%22 fill=%22%23f0f0f0%22 text-anchor=%22middle%22>BB</text></svg>">
<meta name="description" content="{{ page.description | default: site.description }}">
<style>
  @font-face {
    font-family: 'Ubuntu Mono';
    src: url('/ubuntu-mono.ttf') format('truetype-variations');
    font-weight: 400 700;
    font-display: swap;
  }

  :root {
    --bg: #0a0a0a;
    --text: #f0f0f0;
    --text-dim: #a3a3a3;
    --text-dimmer: #6a6a6a;
    --border: rgba(255,255,255,0.10);
    --glass: rgba(255,255,255,0.045);
    --glass-strong: rgba(255,255,255,0.08);
  }

  * { box-sizing: border-box; }

  /* Gradients are layered directly on body's own background (not a
     separate ::before with z-index) -- that avoids any stacking-context
     ambiguity, since body itself isn't positioned and z-index on an
     unpositioned ancestor's pseudo-element is exactly the kind of thing
     that silently does nothing in some browsers. Fixed pixel sizes, not
     viewport-relative percentages, so the glow reliably reaches the
     centered content column regardless of screen width. background-
     attachment:fixed keeps it from scrolling with the page. */
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 1000px 600px at 50% -10%, rgba(255,255,255,0.35), transparent 70%),
      radial-gradient(ellipse 700px 550px at 15% 60%, rgba(255,255,255,0.22), transparent 70%),
      radial-gradient(ellipse 700px 550px at 85% 90%, rgba(255,255,255,0.22), transparent 70%),
      #0a0a0a;
    /* Larger than the viewport so background-position has room to
       actually pan -- without this, the gradients already cover
       100% of the element and shifting position has nothing visible
       to do. */
    background-size: 130% 130%;
    background-attachment: fixed;
    animation: drift 30s ease-in-out infinite alternate;
    color: var(--text);
    font-family: 'Ubuntu Mono', 'Cascadia Mono', 'SF Mono', Consolas, Menlo, monospace;
    line-height: 1.7;
  }

  /* Swapped in by JS once a randomly-picked background photo has
     actually finished loading (see script at the bottom) -- the plain
     gradient above is the real fallback, not a placeholder: it's what
     stays if JS fails, if the image errors, or if the visitor has
     Data Saver on (checked before the image is ever requested). */
  html.bg-photo, body.bg-photo {
    background-image:
      linear-gradient(rgba(10,10,10,0.55), rgba(10,10,10,0.75)),
      var(--bg-photo);
    background-size: cover, 130% 130%;
  }

  @media (prefers-reduced-motion: reduce) {
    html, body { animation: none; }
  }

  .glass {
    background: var(--glass);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1px solid var(--border);
    border-radius: 16px;
  }

  header {
    max-width: 700px;
    margin: 0 auto;
    padding: 32px 20px 0 20px;
  }

  nav {
    display: flex;
    justify-content: center;
    gap: 16px;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px 14px;
    margin: 0 auto 32px auto;
    width: fit-content;
  }
  nav a {
    color: var(--text-dim);
    text-decoration: none;
    padding: 6px 18px;
    border-radius: 8px;
    transition: color 0.2s ease, background 0.2s ease;
  }
  nav a:hover { color: var(--text); background: var(--glass-strong); }
  nav a.active { color: var(--text); background: var(--glass-strong); }

  main {
    max-width: 700px;
    margin: 0 auto;
    padding: 0 20px 80px 20px;
  }

  main > .glass {
    padding: 36px 40px;
    animation: rise 0.4s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes drift {
    from { background-position: 0% 0%; }
    to { background-position: 10% 6%; }
  }

  h1, h2, h3 {
    color: #ffffff;
    line-height: 1.35;
    font-weight: 700;
  }
  h1 { font-size: 24px; margin-bottom: 4px; }
  h2 { font-size: 17px; margin-top: 40px; letter-spacing: 0.02em; }

  p { font-size: 15px; color: var(--text); margin: 18px 0; }

  a { color: var(--text-dim); text-decoration-color: var(--text-dimmer); text-underline-offset: 3px; transition: color 0.2s ease, text-decoration-color 0.2s ease; }
  a:hover { color: var(--text); text-decoration-color: var(--text); }

  .meta {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dimmer);
    margin-bottom: 24px;
  }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 40px 0;
  }

  ol, ul { font-size: 15px; padding-left: 22px; }
  li { margin: 8px 0; }

  code {
    background: var(--glass-strong);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.92em;
  }

  blockquote {
    border-left: 2px solid var(--text-dimmer);
    margin: 20px 0;
    padding-left: 16px;
    color: var(--text-dim);
  }

  .social-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 20px 0;
  }
  .social-links a {
    padding: 6px 14px;
    border-radius: 20px;
    background: var(--glass);
    border: 1px solid var(--border);
    font-size: 13px;
    text-decoration: none;
    color: var(--text-dim);
    transition: color 0.2s ease, background 0.2s ease;
  }
  .social-links a:hover { background: var(--glass-strong); color: var(--text); }

  details.resume-toggle summary {
    cursor: pointer;
    list-style: none;
    color: var(--text-dim);
    text-decoration: underline;
    text-decoration-color: var(--text-dimmer);
    text-underline-offset: 3px;
    font-size: 15px;
    user-select: none;
    transition: color 0.2s ease, text-decoration-color 0.2s ease;
  }
  details.resume-toggle summary::-webkit-details-marker { display: none; }
  details.resume-toggle summary:hover { color: var(--text); text-decoration-color: var(--text); }

  /* Chevron instead of the -> other nav links use -- this doesn't
     navigate anywhere, it expands content on the same page, so it
     shouldn't look like the same affordance. Rotates on open instead
     of just appearing/disappearing. */
  details.resume-toggle summary .chevron {
    display: inline-block;
    transition: transform 0.2s ease;
  }
  details.resume-toggle[open] summary .chevron { transform: rotate(90deg); }

  /* Transition-based, not a keyframe animation -- driven by the
     .visible class from the toggle listener below. A restarted
     keyframe animation flashes the content at full opacity for one
     frame before jumping back to its 0% state, which reads as a
     flicker; a transition just interpolates smoothly from wherever
     it currently is. */
  /* Starts hidden only once JS confirms it can actually reveal it
     again (.js-anim, added on load) -- without that, content would
     stay stuck at opacity:0 forever if JS fails to run. */
  .resume-content {
    margin-top: 16px;
  }
  .resume-content.js-anim {
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.4s ease-out, transform 0.4s ease-out;
  }
  .resume-content.js-anim.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .resume-content > h2:first-of-type { margin-top: 12px; }

  .post-list-item {
    padding: 16px;
    margin: 10px 0;
    border-radius: 10px;
    background: var(--glass);
    border: 1px solid var(--border);
  }
  .post-list-item .date { font-size: 11px; color: var(--text-dimmer); letter-spacing: 0.04em; }
  .post-list-item a {
    display: block;
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
    text-decoration: none;
    margin-top: 4px;
    transition: color 0.2s ease;
  }
  .post-list-item a:hover { color: var(--text-dim); }

  .empty-note { color: var(--text-dimmer); font-size: 14px; }
</style>
</head>
<body>

<header>
  <nav class="glass">
    <a href="/" {% if page.url == "/" %}class="active"{% endif %}>Home</a>
    <a href="/about/" {% if page.url == "/about/" %}class="active"{% endif %}>About</a>
    <a href="/roadmap/" {% if page.url == "/roadmap/" %}class="active"{% endif %}>Roadmap</a>
    <a href="/blog/" {% if page.url == "/blog/" or page.layout == "post" %}class="active"{% endif %}>Blog</a>
  </nav>
</header>

<main>
<div class="glass">
{{ content }}
</div>
</main>

<script>
// One random background photo per page load -- not fetched from any
// live API, just picked from the small pre-optimized set already in
// this repo (14 images, ~55KB average). Respects Data Saver (skipped
// entirely, never even requested, if the visitor has it on) and only
// swaps the CSS in once the image has actually finished loading, so
// there's no flash of a broken/half-loaded background. The plain
// gradient in the CSS is the real fallback -- not a placeholder -- for
// no-JS, image-load-failure, and Data Saver cases alike.
(function () {
  if (navigator.connection && navigator.connection.saveData) return;
  var count = 14;
  var pick = 'bg-' + String(Math.floor(Math.random() * count) + 1).padStart(2, '0') + '.webp';
  var url = '/images/bg/' + pick;
  var img = new Image();
  img.onload = function () {
    document.documentElement.style.setProperty('--bg-photo', 'url(' + url + ')');
    document.documentElement.classList.add('bg-photo');
    document.body.classList.add('bg-photo');
  };
  img.src = url;
})();

// .resume-content starts at opacity:0 always (see CSS). Adding
// .visible one frame after <details> opens lets the transition
// animate smoothly from that 0 state -- the double rAF ensures the
// browser has actually painted the opacity:0 frame first, so there's
// no flash to full opacity before the fade-in starts.
document.querySelectorAll('details.resume-toggle').forEach(function (d) {
  var content = d.querySelector('.resume-content');
  if (!content) return;
  content.classList.add('js-anim');
  d.addEventListener('toggle', function () {
    if (d.open) {
      content.classList.remove('visible');
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          content.classList.add('visible');
        });
      });
    } else {
      content.classList.remove('visible');
    }
  });
});
</script>

</body>
</html>
