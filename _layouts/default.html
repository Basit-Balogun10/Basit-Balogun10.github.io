<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<style>
  @font-face {
    font-family: 'Ubuntu Mono';
    src: url('/ubuntu-mono.ttf') format('truetype-variations');
    font-weight: 400 700;
    font-display: swap;
  }

  :root {
    --bg: #0a0a0a;
    --text: #f0f0f0;
    --text-dim: #a3a3a3;
    --text-dimmer: #6a6a6a;
    --border: rgba(255,255,255,0.10);
    --glass: rgba(255,255,255,0.045);
    --glass-strong: rgba(255,255,255,0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #0a0a0a;
    color: var(--text);
    font-family: 'Ubuntu Mono', 'Cascadia Mono', 'SF Mono', Consolas, Menlo, monospace;
    line-height: 1.7;
  }

  /* Fixed so it doesn't scroll away -- gives the .glass panels'
     backdrop-filter something real to blur against, so the glass
     effect reads for every visitor, not just ones with their own
     OS-level window transparency turned on (that's a separate,
     per-user thing this page has no control over either way). */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(circle at 15% 15%, rgba(255,255,255,0.07), transparent 40%),
      radial-gradient(circle at 85% 10%, rgba(255,255,255,0.05), transparent 35%),
      radial-gradient(circle at 50% 95%, rgba(255,255,255,0.06), transparent 45%);
  }

  .glass {
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 16px;
  }

  header {
    max-width: 700px;
    margin: 0 auto;
    padding: 32px 20px 0 20px;
  }

  nav {
    display: flex;
    justify-content: center;
    gap: 4px;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px 14px;
    margin: 0 auto 32px auto;
    width: fit-content;
  }
  nav a {
    color: var(--text-dim);
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 8px;
  }
  nav a:hover { color: var(--text); background: var(--glass-strong); }
  nav a.active { color: var(--text); background: var(--glass-strong); }

  main {
    max-width: 700px;
    margin: 0 auto;
    padding: 0 20px 80px 20px;
  }

  main > .glass {
    padding: 36px 40px;
    animation: rise 0.4s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1, h2, h3 {
    color: #ffffff;
    line-height: 1.35;
    font-weight: 700;
  }
  h1 { font-size: 24px; margin-bottom: 4px; }
  h2 { font-size: 17px; margin-top: 40px; letter-spacing: 0.02em; }

  p { font-size: 15px; color: var(--text); margin: 18px 0; }

  a { color: var(--text-dim); text-decoration-color: var(--text-dimmer); text-underline-offset: 3px; }
  a:hover { color: var(--text); text-decoration-color: var(--text); }

  .meta {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dimmer);
    margin-bottom: 24px;
  }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 40px 0;
  }

  ol, ul { font-size: 15px; padding-left: 22px; }
  li { margin: 8px 0; }

  code {
    background: var(--glass-strong);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.92em;
  }

  blockquote {
    border-left: 2px solid var(--text-dimmer);
    margin: 20px 0;
    padding-left: 16px;
    color: var(--text-dim);
  }

  .social-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 20px 0;
  }
  .social-links a {
    padding: 6px 14px;
    border-radius: 20px;
    background: var(--glass);
    border: 1px solid var(--border);
    font-size: 13px;
    text-decoration: none;
    color: var(--text-dim);
  }
  .social-links a:hover { background: var(--glass-strong); color: var(--text); }

  details.resume-toggle summary {
    cursor: pointer;
    list-style: none;
    color: var(--text-dim);
    text-decoration: underline;
    text-decoration-color: var(--text-dimmer);
    text-underline-offset: 3px;
    font-size: 15px;
    user-select: none;
  }
  details.resume-toggle summary::-webkit-details-marker { display: none; }
  details.resume-toggle summary:hover { color: var(--text); text-decoration-color: var(--text); }

  /* Chevron instead of the -> other nav links use -- this doesn't
     navigate anywhere, it expands content on the same page, so it
     shouldn't look like the same affordance. Rotates on open instead
     of just appearing/disappearing. */
  details.resume-toggle summary .chevron {
    display: inline-block;
    transition: transform 0.2s ease;
  }
  details.resume-toggle[open] summary .chevron { transform: rotate(90deg); }

  /* Re-triggers each time <details> opens -- a display:none -> visible
     transition restarts a statically-applied CSS animation, no JS
     needed. */
  .resume-content {
    margin-top: 16px;
    animation: rise 0.4s ease-out;
  }
  .resume-content > h2:first-of-type { margin-top: 12px; }

  .post-list-item {
    padding: 16px;
    margin: 10px 0;
    border-radius: 10px;
    background: var(--glass);
    border: 1px solid var(--border);
  }
  .post-list-item .date { font-size: 11px; color: var(--text-dimmer); letter-spacing: 0.04em; }
  .post-list-item a {
    display: block;
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
    text-decoration: none;
    margin-top: 4px;
  }
  .post-list-item a:hover { color: var(--text-dim); }

  .empty-note { color: var(--text-dimmer); font-size: 14px; }

  footer {
    max-width: 700px;
    margin: 0 auto;
    padding: 0 20px 60px 20px;
    text-align: center;
    font-size: 11px;
    color: var(--text-dimmer);
  }
  footer a { color: var(--text-dimmer); }
</style>
</head>
<body>

<header>
  <nav class="glass">
    <a href="/" {% if page.url == "/" %}class="active"{% endif %}>Home</a>
    <a href="/about/" {% if page.url == "/about/" %}class="active"{% endif %}>About</a>
    <a href="/roadmap/" {% if page.url == "/roadmap/" %}class="active"{% endif %}>Roadmap</a>
    <a href="/blog/" {% if page.url == "/blog/" or page.layout == "post" %}class="active"{% endif %}>Blog</a>
  </nav>
</header>

<main>
<div class="glass">
{{ content }}
</div>
</main>

<footer>
  <a href="https://github.com/Basit-Balogun10">GitHub</a>
</footer>

</body>
</html>
